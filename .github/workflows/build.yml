name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v5.28.7. Empty uses the selected ref name."
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_CACHE_VERSION: v2
  BUN_VERSION: "1.2.23"

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: Resolve tag input
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="${{ github.ref_name }}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build (Windows)
    needs: resolve-release
    runs-on: windows-2025-vs2026
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      CACHE_SCOPE: windows-2025-vs2026
      RUST_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare dependency cache keys
        id: cache-keys
        run: node .github/scripts/write_ci_cache_keys.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-${{ env.RUST_TARGET }}-rust-${{ steps.cache-keys.outputs.rust_deps_key }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-bun-${{ steps.cache-keys.outputs.node_deps_key }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-bun-

      - name: Cache Tauri packaging tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~\AppData\Local\tauri
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-tauri-${{ steps.cache-keys.outputs.node_deps_key }}-${{ steps.cache-keys.outputs.rust_deps_key }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-tauri-

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri application
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create Windows Portable version
        if: needs.resolve-release.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG".TrimStart('v')
          $exePath = "src-tauri/target/release/any-code.exe"
          $portableName = "any-code_${version}_x64-portable.exe"
          $portablePath = "src-tauri/target/release/bundle/$portableName"
          New-Item -ItemType Directory -Force -Path "src-tauri/target/release/bundle"
          Copy-Item $exePath $portablePath
          Write-Host "Created portable version: $portableName"

      - name: Upload build artifacts
        if: needs.resolve-release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: |
            src-tauri/target/*/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-Windows
          path: |
            src-tauri/target/*/release/build/*/output
            src-tauri/target/release/build/*/output
          retention-days: 3

  publish-windows:
    name: Publish Windows assets early
    needs: [resolve-release, build-windows]
    runs-on: ubuntu-latest
    if: needs.resolve-release.outputs.is_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: artifacts

      - name: Normalize Windows assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p windows-assets

          WIN_PORTABLE=$(find artifacts -name "*-portable.exe" -type f | head -n 1)
          WIN_NSIS=$(find artifacts -name "*-setup.exe" ! -name "*.sig" -type f | head -n 1)
          WIN_NSIS_SIG=$(find artifacts -name "*-setup.exe.sig" -type f | head -n 1)
          WIN_MSI=$(find artifacts -name "*.msi" ! -name "*.sig" -type f | head -n 1)
          WIN_MSI_SIG=$(find artifacts -name "*.msi.sig" -type f | head -n 1)

          for required in "$WIN_PORTABLE" "$WIN_NSIS" "$WIN_NSIS_SIG" "$WIN_MSI" "$WIN_MSI_SIG"; do
            if [ -z "$required" ] || [ ! -f "$required" ]; then
              echo "::error::Missing expected Windows artifact."
              find artifacts -maxdepth 6 -type f | sort
              exit 1
            fi
          done

          cp "$WIN_PORTABLE" "windows-assets/any-code_${VERSION}_x64-portable.exe"
          cp "$WIN_NSIS" "windows-assets/any-code_${VERSION}_x64-setup.exe"
          cp "$WIN_NSIS_SIG" "windows-assets/any-code_${VERSION}_x64-setup.exe.sig"
          cp "$WIN_MSI" "windows-assets/any-code_${VERSION}_x64.msi"
          cp "$WIN_MSI_SIG" "windows-assets/any-code_${VERSION}_x64.msi.sig"

          python3 .github/scripts/merge_latest_json.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output windows-assets/latest.json \
            --platform "windows-x86_64|windows-assets/any-code_${VERSION}_x64-setup.exe.sig|any-code_${VERSION}_x64-setup.exe"

      - name: Prepare Windows-first release notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 .github/scripts/generate_release_notes.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

          {
            echo "## Windows 版本已优先上传"
            echo
            echo "Linux/macOS 构建完成后会继续补充对应安装包，并刷新完整的 latest.json。"
            echo
            cat release-notes.md
          } > release-notes-windows.md

      - name: Create or update release and upload Windows assets
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Any Code $RELEASE_TAG" \
              --notes-file release-notes-windows.md
          else
            gh release create "$RELEASE_TAG" \
              --title "Any Code $RELEASE_TAG" \
              --notes-file release-notes-windows.md
          fi

          gh release upload "$RELEASE_TAG" windows-assets/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build (Linux)
    needs: [resolve-release, build-windows]
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      CACHE_SCOPE: ubuntu-22.04
      RUST_TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare dependency cache keys
        id: cache-keys
        run: node .github/scripts/write_ci_cache_keys.mjs

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-${{ env.RUST_TARGET }}-rust-${{ steps.cache-keys.outputs.rust_deps_key }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-bun-${{ steps.cache-keys.outputs.node_deps_key }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-bun-

      - name: Cache Tauri packaging tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~\AppData\Local\tauri
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-tauri-${{ steps.cache-keys.outputs.node_deps_key }}-${{ steps.cache-keys.outputs.rust_deps_key }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-tauri-

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri application
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build artifacts
        if: needs.resolve-release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-Linux
          path: |
            src-tauri/target/*/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-Linux
          path: |
            src-tauri/target/*/release/build/*/output
            src-tauri/target/release/build/*/output
          retention-days: 3

  build-macos:
    name: Build (${{ matrix.platform.name }})
    needs: [resolve-release, build-linux]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-ARM
            os: macos-15
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
          - name: macOS-Intel
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      CACHE_SCOPE: ${{ matrix.platform.os }}
      RUST_TARGET: ${{ matrix.platform.rust-target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare dependency cache keys
        id: cache-keys
        run: node .github/scripts/write_ci_cache_keys.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-${{ env.RUST_TARGET }}-rust-${{ steps.cache-keys.outputs.rust_deps_key }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-bun-${{ steps.cache-keys.outputs.node_deps_key }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-bun-

      - name: Cache Tauri packaging tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~\AppData\Local\tauri
          key: ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-tauri-${{ steps.cache-keys.outputs.node_deps_key }}-${{ steps.cache-keys.outputs.rust_deps_key }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-${{ env.CACHE_SCOPE }}-tauri-

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri application
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-logs
          {
            echo "=== macOS build diagnostics ==="
            echo "runner.os=${{ runner.os }}"
            echo "platform.name=${{ matrix.platform.name }}"
            echo "platform.os=${{ matrix.platform.os }}"
            echo "rust_target=${{ matrix.platform.rust-target }}"
            echo "tauri_args=${{ matrix.platform.tauri-args }}"
            echo
            sw_vers || true
            uname -a || true
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            echo
            rustc -Vv || true
            cargo -V || true
            rustup show || true
            echo
            bun --version || true
          } | tee "ci-logs/macos-env-${{ matrix.platform.name }}.log"

          LOG="ci-logs/tauri-build-${{ matrix.platform.name }}.log"

          run_tauri_build() {
            set +e
            bun run tauri build ${{ matrix.platform.tauri-args }} 2>&1 | tee -a "$LOG"
            local status=${PIPESTATUS[0]}
            set -e
            return "$status"
          }

          echo "=== First Tauri build attempt ===" | tee "$LOG"
          if ! run_tauri_build; then
            echo "=== First attempt failed; retrying once after clearing bundle output ===" | tee -a "$LOG"
            rm -rf "src-tauri/target/${{ matrix.platform.rust-target }}/release/bundle" || true
            rm -rf "src-tauri/target/release/bundle" || true
            sleep 10
            run_tauri_build
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build artifacts
        if: needs.resolve-release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform.name }}
          path: |
            src-tauri/target/*/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform.name }}
          path: |
            ci-logs/**/*.log
            src-tauri/target/*/release/build/*/output
            src-tauri/target/release/build/*/output
          retention-days: 3

  publish-linux:
    name: Publish Linux assets early
    needs: [resolve-release, build-linux]
    runs-on: ubuntu-latest
    if: needs.resolve-release.outputs.is_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: build-Linux
          path: artifacts

      - name: Download existing latest.json
        continue-on-error: true
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern latest.json \
            --output latest-existing.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Linux assets and latest.json
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p linux-assets

          LINUX_APPIMAGE=$(find artifacts -name "*.AppImage" ! -name "*.sig" -type f | head -n 1)
          LINUX_APPIMAGE_SIG=$(find artifacts -name "*.AppImage.sig" -type f | head -n 1)
          LINUX_DEB=$(find artifacts -name "*.deb" -type f | head -n 1)
          LINUX_RPM=$(find artifacts -name "*.rpm" -type f | head -n 1)

          for required in "$LINUX_APPIMAGE" "$LINUX_APPIMAGE_SIG" "$LINUX_DEB"; do
            if [ -z "$required" ] || [ ! -f "$required" ]; then
              echo "::error::Missing expected Linux AppImage/signature/deb artifact."
              find artifacts -maxdepth 6 -type f | sort
              exit 1
            fi
          done

          cp "$LINUX_APPIMAGE" "linux-assets/any-code_${VERSION}_amd64.AppImage"
          cp "$LINUX_APPIMAGE_SIG" "linux-assets/any-code_${VERSION}_amd64.AppImage.sig"
          cp "$LINUX_DEB" "linux-assets/any-code_${VERSION}_amd64.deb"

          if [ -n "$LINUX_RPM" ] && [ -f "$LINUX_RPM" ]; then
            cp "$LINUX_RPM" "linux-assets/any-code_${VERSION}_x86_64.rpm"
          fi

          python3 .github/scripts/merge_latest_json.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --existing latest-existing.json \
            --output linux-assets/latest.json \
            --platform "linux-x86_64|linux-assets/any-code_${VERSION}_amd64.AppImage.sig|any-code_${VERSION}_amd64.AppImage"

      - name: Prepare Linux-ready release notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 .github/scripts/generate_release_notes.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

          {
            echo "## Windows / Linux 版本已优先上传"
            echo
            echo "Windows 安装包和 Linux AppImage/deb 已可下载；macOS 构建完成后会继续补充对应安装包，并刷新完整的 latest.json。"
            echo
            cat release-notes.md
          } > release-notes-linux.md

      - name: Create or update release and upload Linux assets
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Any Code $RELEASE_TAG" \
              --notes-file release-notes-linux.md
          else
            gh release create "$RELEASE_TAG" \
              --title "Any Code $RELEASE_TAG" \
              --notes-file release-notes-linux.md
          fi

          gh release upload "$RELEASE_TAG" linux-assets/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create Release
    needs: [resolve-release, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: needs.resolve-release.outputs.is_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Rename updater files for consistent naming
        run: |
          VERSION="${RELEASE_TAG#v}"

          AARCH64_TAR=$(find artifacts -path "*aarch64*" -name "*.app.tar.gz" ! -name "*.sig" -type f | head -n 1)
          AARCH64_SIG=$(find artifacts -path "*aarch64*" -name "*.app.tar.gz.sig" -type f | head -n 1)
          if [ -n "$AARCH64_TAR" ]; then
            AARCH64_DIR=$(dirname "$AARCH64_TAR")
            mv "$AARCH64_TAR" "$AARCH64_DIR/any-code_${VERSION}_aarch64.app.tar.gz"
          fi
          if [ -n "$AARCH64_SIG" ]; then
            AARCH64_DIR=$(dirname "$AARCH64_SIG")
            mv "$AARCH64_SIG" "$AARCH64_DIR/any-code_${VERSION}_aarch64.app.tar.gz.sig"
          fi

          X64_TAR=$(find artifacts -path "*x86_64*" -name "*.app.tar.gz" ! -name "*.sig" -type f | head -n 1)
          X64_SIG=$(find artifacts -path "*x86_64*" -name "*.app.tar.gz.sig" -type f | head -n 1)
          if [ -n "$X64_TAR" ]; then
            X64_DIR=$(dirname "$X64_TAR")
            mv "$X64_TAR" "$X64_DIR/any-code_${VERSION}_x64.app.tar.gz"
          fi
          if [ -n "$X64_SIG" ]; then
            X64_DIR=$(dirname "$X64_SIG")
            mv "$X64_SIG" "$X64_DIR/any-code_${VERSION}_x64.app.tar.gz.sig"
          fi

          WIN_NSIS=$(find artifacts -name "*-setup.exe" ! -name "*.sig" -type f | head -n 1)
          WIN_NSIS_SIG=$(find artifacts -name "*-setup.exe.sig" -type f | head -n 1)
          if [ -n "$WIN_NSIS" ]; then
            WIN_DIR=$(dirname "$WIN_NSIS")
            TARGET="$WIN_DIR/any-code_${VERSION}_x64-setup.exe"
            if [ "$WIN_NSIS" != "$TARGET" ]; then
              mv "$WIN_NSIS" "$TARGET"
            fi
          fi
          if [ -n "$WIN_NSIS_SIG" ]; then
            WIN_DIR=$(dirname "$WIN_NSIS_SIG")
            TARGET="$WIN_DIR/any-code_${VERSION}_x64-setup.exe.sig"
            if [ "$WIN_NSIS_SIG" != "$TARGET" ]; then
              mv "$WIN_NSIS_SIG" "$TARGET"
            fi
          fi

          WIN_PORTABLE=$(find artifacts -name "*-portable.exe" -type f | head -n 1)
          if [ -n "$WIN_PORTABLE" ]; then
            WIN_DIR=$(dirname "$WIN_PORTABLE")
            TARGET="$WIN_DIR/any-code_${VERSION}_x64-portable.exe"
            if [ "$WIN_PORTABLE" != "$TARGET" ]; then
              mv "$WIN_PORTABLE" "$TARGET"
            fi
          fi

          WIN_MSI=$(find artifacts -name "*.msi" ! -name "*.sig" -type f | head -n 1)
          WIN_MSI_SIG=$(find artifacts -name "*.msi.sig" -type f | head -n 1)
          if [ -n "$WIN_MSI" ]; then
            WIN_DIR=$(dirname "$WIN_MSI")
            TARGET="$WIN_DIR/any-code_${VERSION}_x64.msi"
            if [ "$WIN_MSI" != "$TARGET" ]; then
              mv "$WIN_MSI" "$TARGET"
            fi
          fi
          if [ -n "$WIN_MSI_SIG" ]; then
            WIN_DIR=$(dirname "$WIN_MSI_SIG")
            TARGET="$WIN_DIR/any-code_${VERSION}_x64.msi.sig"
            if [ "$WIN_MSI_SIG" != "$TARGET" ]; then
              mv "$WIN_MSI_SIG" "$TARGET"
            fi
          fi

          LINUX_APPIMAGE=$(find artifacts -name "*.AppImage" ! -name "*.sig" -type f | head -n 1)
          LINUX_APPIMAGE_SIG=$(find artifacts -name "*.AppImage.sig" -type f | head -n 1)
          if [ -n "$LINUX_APPIMAGE" ]; then
            LINUX_DIR=$(dirname "$LINUX_APPIMAGE")
            mv "$LINUX_APPIMAGE" "$LINUX_DIR/any-code_${VERSION}_amd64.AppImage"
          fi
          if [ -n "$LINUX_APPIMAGE_SIG" ]; then
            LINUX_DIR=$(dirname "$LINUX_APPIMAGE_SIG")
            mv "$LINUX_APPIMAGE_SIG" "$LINUX_DIR/any-code_${VERSION}_amd64.AppImage.sig"
          fi

      - name: Generate latest.json for updater
        run: |
          VERSION="${RELEASE_TAG#v}"
          DARWIN_AARCH64_SIG=$(find artifacts -name "*_aarch64.app.tar.gz.sig" -type f | head -n 1)
          DARWIN_X64_SIG=$(find artifacts -name "*_x64.app.tar.gz.sig" -type f | head -n 1)
          LINUX_SIG=$(find artifacts -name "*.AppImage.sig" -type f | head -n 1)
          WINDOWS_NSIS_SIG=$(find artifacts -name "*-setup.exe.sig" -type f | head -n 1)

          python3 .github/scripts/merge_latest_json.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output latest.json \
            --platform "darwin-aarch64|$DARWIN_AARCH64_SIG|any-code_${VERSION}_aarch64.app.tar.gz" \
            --platform "darwin-x86_64|$DARWIN_X64_SIG|any-code_${VERSION}_x64.app.tar.gz" \
            --platform "linux-x86_64|$LINUX_SIG|any-code_${VERSION}_amd64.AppImage" \
            --platform "windows-x86_64|$WINDOWS_NSIS_SIG|any-code_${VERSION}_x64-setup.exe"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release notes
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

      - name: Update release notes
        if: steps.check_release.outputs.exists == 'true'
        run: |
          gh release edit "$RELEASE_TAG" \
            --title "Any Code $RELEASE_TAG" \
            --notes-file release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to existing release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
            -o -name "*.msi" -o -name "*.msi.sig" -o -name "*-setup.exe" -o -name "*-setup.exe.sig" \
            -o -name "*-portable.exe" -o -name "*.AppImage" -o -name "*.AppImage.sig" \
            -o -name "*.deb" -o -name "*.rpm" \) -exec gh release upload "$RELEASE_TAG" {} --clobber \;
          gh release upload "$RELEASE_TAG" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mapfile -t files < <(find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
            -o -name "*.msi" -o -name "*.msi.sig" -o -name "*-setup.exe" -o -name "*-setup.exe.sig" \
            -o -name "*-portable.exe" -o -name "*.AppImage" -o -name "*.AppImage.sig" \
            -o -name "*.deb" -o -name "*.rpm" \) -print)
          files+=("latest.json")

          if [ "${#files[@]}" -eq 1 ]; then
            echo "::error::No release artifacts found."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --title "Any Code $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${files[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
